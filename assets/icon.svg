<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BODHI 菩提">
  <title>BODHI · 菩提</title>
  <defs>
    <!-- Deep warm inkstone radial atmosphere -->
    <radialGradient id="inkstone-bg" cx="46%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1a1916" />
      <stop offset="62%" stop-color="#121210" />
      <stop offset="100%" stop-color="#0c0c0a" />
    </radialGradient>

    <!-- Subtle antique-gold hairline border sheen -->
    <linearGradient id="rim-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6ab7c" stop-opacity="0.38" />
      <stop offset="48%" stop-color="#ece7de" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#c6ab7c" stop-opacity="0.24" />
    </linearGradient>

    <!-- Organic ink-on-xuan brush tone for the Enso -->
    <linearGradient id="enso-ink" x1="15%" y1="88%" x2="85%" y2="20%">
      <stop offset="0%" stop-color="#ece7de" stop-opacity="0.96" />
      <stop offset="52%" stop-color="#e5dfd3" stop-opacity="0.92" />
      <stop offset="86%" stop-color="#d5cec0" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#c6bfb0" stop-opacity="0.38" />
    </linearGradient>

    <!-- Restrained cinnabar seal ink -->
    <linearGradient id="cinnabar-seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c25042" />
      <stop offset="100%" stop-color="#a83d30" />
    </linearGradient>
  </defs>

  <!-- Rounded Inkstone Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#inkstone-bg)" />

  <!-- Outer Crisp Paper-Gold Micro Rim -->
  <rect x="17" y="17" width="478" height="478" rx="107" fill="none" stroke="url(#rim-gold)" stroke-width="1.5" />

  <!-- Inner Quiet Architectural Hairline Frame -->
  <rect x="30" y="30" width="452" height="452" rx="95" fill="none" stroke="#ece7de" stroke-opacity="0.065" stroke-width="1" />

  <!-- Subtle Contemplative Halo Breath behind Enso -->
  <circle cx="244" cy="248" r="136" fill="none" stroke="#c6ab7c" stroke-opacity="0.07" stroke-width="1" />

  <!-- Faint Secondary Dry-Brush Whisper along Tail -->
  <path
    d="M 278 380
       C 198 398, 114 342, 102 260
       C 90 176, 152 104, 236 102
       C 320 100, 386 164, 382 248
       C 380 272, 375 292, 366 308"
    fill="none"
    stroke="#ece7de"
    stroke-opacity="0.16"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Primary Song-Minimalist Calligraphic Enso (Tapered Organic Brush Stroke) -->
  <path
    d="M 284 374
       C 208 400, 118 352, 100 270
       C 82 186, 138 106, 226 98
       C 312 90, 386 154, 386 240
       C 386 264, 380 286, 368 304
       C 365 308, 361 306, 362 301
       C 371 283, 374 263, 373 241
       C 370 166, 306 112, 230 118
       C 154 124, 106 192, 122 266
       C 138 336, 212 376, 279 356
       C 289 353, 294 370, 284 374 Z"
    fill="url(#enso-ink)"
  />

  <!-- Restrained Cinnabar Seal (落款方印 · 菩提) Nestled in the Enso's Opening -->
  <g transform="translate(324, 318)">
    <!-- Seal Body -->
    <rect x="0" y="0" width="68" height="88" rx="6" fill="url(#cinnabar-seal)" />
    <!-- Delicate Incised Inner Seal Border -->
    <rect x="5" y="5" width="58" height="78" rx="3" fill="none" stroke="#f5efe4" stroke-opacity="0.34" stroke-width="1.1" />

    <!-- Carved Seal-Script Vertical Glyphs: 菩 (top) / 提 (bottom) -->
    <g fill="none" stroke="#f5efe4" stroke-width="2.35" stroke-linecap="square" stroke-linejoin="miter" opacity="0.96">
      <!-- 菩 (y: 13..40) -->
      <path d="M 16 17 H 52" />
      <path d="M 26 13 V 20 M 42 13 V 20" />
      <path d="M 34 21 V 24 M 21 24 H 47" />
      <path d="M 27 25 V 29 M 41 25 V 29 M 16 30 H 52" />
      <rect x="23" y="34" width="22" height="7" />

      <!-- 提 (y: 47..75) -->
      <!-- 扌 -->
      <path d="M 16 54 H 27 M 22 48 V 74 M 16 64 L 27 59" />
      <!-- 是 -->
      <rect x="33" y="48" width="17" height="10" />
      <path d="M 33 53 H 50" />
      <path d="M 30 62 H 53" />
      <path d="M 41 62 V 72 M 41 67 H 50" />
      <path d="M 34 65 V 71 M 30 74 L 35 70 L 53 74" />
    </g>
  </g>
</svg>
